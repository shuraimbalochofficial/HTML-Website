<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      body {
        padding: 0;
        margin: 0;
        height: 85vh;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #error {
        border: 5px solid #088178;
        padding: 35px 20px;
      }

      #error .details {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
      }
      #error .details h1,
      #error .details h3 {
        margin: 0 0 5px 0;
      }
      #error .details .message {
        margin: 0 0 12px 0;
      }
    </style>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="error">
      <div class="details">
        <h1 class="">404 Page Not Found</h1>
        <h3 class="">It's Not Your Fault, It's Us!</h3>
        <div class="message">
          <p>The page is under construction, please visit later</p>
        </div>
        <a href="index.html" class="error-link">Back to Home</a>
      </div>
    </section>
  </body>
</html>
